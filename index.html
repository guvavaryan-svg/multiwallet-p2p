<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiwalletP2P - Login & Register</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00d2ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
    }
    .brand-container {
      text-align: center;
      margin-bottom: 25px;
    }
    .mw-badge {
      background: linear-gradient(135deg, #00d2ff, #0088cc);
      color: #000;
      font-size: 24px;
      font-weight: 900;
      padding: 12px 20px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 12px;
    }
    .brand-title {
      font-size: 26px;
      font-weight: bold;
      color: #00d2ff;
      margin: 0 0 8px 0;
    }
    .brand-subtitle {
      font-size: 13px;
      color: #aaa;
      margin: 0;
      max-width: 300px;
      line-height: 1.4;
    }
    .auth-card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .tab-header {
      display: flex;
      border-bottom: 1px solid #333;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 14px;
      background: transparent;
      border: none;
      color: #888;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      text-align: center;
    }
    .tab-btn.active {
      color: #00d2ff;
      border-bottom: 3px solid #00d2ff;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: #ccc;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 12px;
      background: #282828;
      border: 1px solid #3d3d3d;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }
    .form-input:focus {
      border-color: #00d2ff;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #ff444f;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(255, 68, 79, 0.3);
    }
    .btn-forgot {
      background: transparent;
      color: #00d2ff;
      border: none;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: underline;
    }
    .feature-list {
      margin-top: 20px;
      border-top: 1px solid #2a2a2a;
      padding-top: 15px;
      font-size: 12px;
      color: #aaa;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .feature-item i {
      color: #00d2ff;
    }
  </style>
</head>
<body>

  <div class="brand-container">
    <div class="mw-badge">MW</div>
    <h1 class="brand-title">MultiwalletP2P</h1>
    <p class="brand-subtitle">Secure P2P Trading, Automatic 1% Commission Locking & Virtual Card Payouts</p>
  </div>

  <div class="auth-card">
    <div class="tab-header">
      <button type="button" class="tab-btn active" id="loginTab" onclick="switchTab('login')">Login</button>
      <button type="button" class="tab-btn" id="registerTab" onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" class="form-input" id="loginEmail" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn-submit"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
      
      <!-- FORGOT PASSWORD LINK (ALWAYS VISIBLE) -->
      <button type="button" class="btn-forgot" onclick="handleForgotPassword()">
        <i class="fa-solid fa-key"></i> Forgot Password?
      </button>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" class="form-input" id="regName" placeholder="Enter full name" required>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" class="form-input" id="regEmail" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-input" id="regPassword" placeholder="Create a password" required>
      </div>

      <button type="submit" class="btn-submit" style="background: #00d2ff; color: #000;"><i class="fa-solid fa-user-plus"></i> Create Account</button>
    </form>

    <div class="feature-list">
      <div class="feature-item"><i class="fa-solid fa-shield-halved"></i> Escrow Protected Trades</div>
      <div class="feature-item"><i class="fa-solid fa-coins"></i> Automatic 1% Commission Locking</div>
      <div class="feature-item"><i class="fa-solid fa-credit-card"></i> Linked Card: •••• •••• •••• 6754</div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      const loginTab = document.getElementById('loginTab');
      const registerTab = document.getElementById('registerTab');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');

      if (tab === 'login') {
        loginTab.classList.add('active');
        registerTab.classList.remove('active');
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
      } else {
        registerTab.classList.add('active');
        loginTab.classList.remove('active');
        registerForm.style.display = 'block';
        loginForm.style.display = 'none';
      }
    }

    function handleLogin(event) {
      event.preventDefault();
      
      const emailInput = document.getElementById('loginEmail').value.trim();
      const passInput = document.getElementById('loginPassword').value.trim();

      if (emailInput && passInput) {
        localStorage.setItem('user_email', emailInput);
        localStorage.setItem('user_pass', passInput);
        sessionStorage.setItem("isLoggedIn", "true");
        window.location.href = "dashboard.html";
      } else {
        alert("Please enter valid email and password credentials.");
      }
    }

    function handleRegister(event) {
      event.preventDefault();

      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const pass = document.getElementById('regPassword').value.trim();

      if (name && email && pass) {
        localStorage.setItem('user_name', name);
        localStorage.setItem('user_email', email);
        localStorage.setItem('user_pass', pass);
        sessionStorage.setItem("isLoggedIn", "true");

        window.location.href = "dashboard.html";
      } else {
        alert("Please complete all registration fields.");
      }
    }

    // FORGOT PASSWORD RESET HANDLER
    function handleForgotPassword() {
      const userEmail = prompt("PASSWORD RESET:\nPlease enter your registered Email Address:");
      if (userEmail && userEmail.trim() !== "") {
        const savedEmail = localStorage.getItem('user_email');
        if (savedEmail && userEmail.trim() === savedEmail) {
          const newPass = prompt("IDENTITY VERIFIED!\nEnter your new password:");
          if (newPass && newPass.length >= 4) {
            localStorage.setItem('user_pass', newPass);
            alert("SUCCESS: Your password has been updated! You can now log in using your new password.");
          } else {
            alert("ERROR: Password must be at least 4 characters long.");
          }
        } else {
          alert("PASSWORD RESET LINK SENT:\nIf an account with " + userEmail + " exists, instructions have been dispatched.");
        }
      }
    }
  </script>

</body>
</html>
