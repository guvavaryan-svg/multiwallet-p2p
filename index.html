<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiwalletP2P - Login</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00d2ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Custom MW Icon -->
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
    }
    .brand-box {
      text-align: center;
      margin-bottom: 25px;
    }
    .mw-badge {
      background: linear-gradient(135deg, #00d2ff, #0088cc);
      color: #000;
      font-weight: 900;
      font-size: 20px;
      padding: 10px 16px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 10px;
    }
    .brand-title {
      font-size: 26px;
      font-weight: bold;
      color: #00d2ff;
      margin: 5px 0;
    }
    .brand-sub {
      font-size: 12px;
      color: #aaa;
      max-width: 300px;
      margin: 0 auto;
      line-height: 1.4;
    }
    .login-card {
      background: #1e1e1e;
      padding: 25px;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      border: 1px solid #2d2d2d;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .tab-header {
      display: flex;
      border-bottom: 1px solid #333;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: #888;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    .tab-btn.active {
      color: #00d2ff;
      border-bottom: 2px solid #00d2ff;
    }
    .input-group {
      margin-bottom: 15px;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      color: #ccc;
      margin-bottom: 5px;
    }
    .input-field {
      width: 100%;
      padding: 12px;
      background: #2b2b2b;
      border: 1px solid #444;
      color: #fff;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .btn-login {
      background: #ff3b30;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      width: 100%;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 2px 8px rgba(255, 59, 48, 0.4);
    }
    .security-info {
      margin-top: 20px;
      border-top: 1px solid #2d2d2d;
      padding-top: 15px;
      font-size: 11px;
      color: #888;
    }
    .sec-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <div class="brand-box">
    <div class="mw-badge">MW</div>
    <div class="brand-title">MultiwalletP2P</div>
    <div class="brand-sub">Secure P2P Trading, Automatic 1% Commission Locking & Virtual Card Payouts</div>
  </div>

  <div class="login-card">
    <div class="tab-header">
      <button class="tab-btn active">Login</button>
      <button class="tab-btn">Create Account</button>
    </div>

    <form onsubmit="event.preventDefault(); loginUser();">
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" class="input-field" placeholder="Enter your email" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" class="input-field" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn-login"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
    </form>

    <div class="security-info">
      <div class="sec-item"><i class="fa-solid fa-shield-halved" style="color:#00ff88;"></i> Escrow Protected Trades</div>
      <div class="sec-item"><i class="fa-solid fa-coins" style="color:#00d2ff;"></i> Automatic 1% Commission Locking</div>
      <div class="sec-item"><i class="fa-solid fa-credit-card" style="color:#ffcc00;"></i> Linked Card: •••• •••• •••• 6754</div>
    </div>
  </div>

  <script>
    function loginUser() {
      sessionStorage.setItem("isLoggedIn", "true");
      window.location.href = "dashboard.html";
    }
  </script>
</body>
</html>
