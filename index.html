<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiwalletP2P - Login & Register</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00d2ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MultiwalletP2P">

  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/888/888870.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .auth-container {
      width: 100%;
      max-width: 420px;
    }
    .brand-header {
      text-align: center;
      margin-bottom: 25px;
    }
    .brand-header h1 {
      color: #00d2ff;
      margin: 0 0 8px 0;
      font-size: 24px;
    }
    .brand-header p {
      color: #a0a0a0;
      font-size: 13px;
      margin: 0;
      line-height: 1.4;
    }
    .card {
      background: #1e1e1e;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 1px solid #333;
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 10px;
      color: #888;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }
    .tab-btn.active {
      color: #00d2ff;
      border-bottom: 2px solid #00d2ff;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #ccc;
      margin-bottom: 6px;
    }
    .input-field {
      width: 100%;
      padding: 12px;
      background: #2b2b2b;
      border: 1px solid #444;
      color: white;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    /* Login button is Red as requested */
    .btn-login {
      background: #ff3b30;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 15px;
      margin-top: 10px;
      box-shadow: 0 2px 6px rgba(255, 59, 48, 0.4);
    }
    .btn-signup {
      background: #00d2ff;
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 15px;
      margin-top: 10px;
    }
    .form-section {
      display: none;
    }
    .form-section.active {
      display: block;
    }
    .features-list {
      margin-top: 20px;
      font-size: 12px;
      color: #888;
      border-top: 1px solid #2a2a2a;
      padding-top: 15px;
    }
    .features-list p {
      margin: 5px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="brand-header">
      <h1><i class="fa-solid fa-wallet"></i> MultiwalletP2P</h1>
      <p>Secure P2P Trading, Automatic 1% Commission Locking & Virtual Card Payouts</p>
    </div>

    <div class="card">
      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Login</button>
        <button class="tab-btn" onclick="switchTab('signup')">Create Account</button>
      </div>

      <!-- Login Form -->
      <div id="loginSection" class="form-section active">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" class="input-field" placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" class="input-field" placeholder="Enter your password">
        </div>
        <button class="btn-login" onclick="handleLogin()"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
      </div>

      <!-- Signup Form -->
      <div id="signupSection" class="form-section">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="signupEmail" class="input-field" placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" class="input-field" placeholder="Create a password">
        </div>
        <button class="btn-signup" onclick="handleSignup()"><i class="fa-solid fa-user-plus"></i> Create Account</button>
      </div>

      <!-- Virtual Card Integration Info -->
      <div class="features-list">
        <p><i class="fa-solid fa-shield-halved" style="color:#00ff88;"></i> Escrow Protected Trades</p>
        <p><i class="fa-solid fa-coins" style="color:#00d2ff;"></i> Automatic 1% Commission Locking</p>
        <p><i class="fa-solid fa-credit-card" style="color:#ffb300;"></i> Linked Card: 5321622512326754</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAJQzI4bXDEMYlr2B3Q5Yq3xNZ84iNQEqk",
      authDomain: "multiwalletp2p.firebaseapp.com",
      projectId: "multiwalletp2p",
      storageBucket: "multiwalletp2p.firebasestorage.app",
      messagingSenderId: "63209264976",
      appId: "1:63209264976:web:15b6c1f0f8c03ca69f3e55",
      measurementId: "G-CPMVBW9J9R"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.switchTab = function(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));

      if (tab === 'login') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('loginSection').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('signupSection').classList.add('active');
      }
    };

    // Ensure Master Virtual Card is locked upon app loading or account actions
    function setMasterCardDefault() {
      localStorage.setItem('masterCardNumber', '5321622512326754');
      if(!localStorage.getItem('masterCommissionLocked')) {
        localStorage.setItem('masterCommissionLocked', '0.00');
      }
    }

    window.handleLogin = function() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value.trim();

      if (!email || !pass) {
        alert("Please enter both email and password.");
        return;
      }

      signInWithEmailAndPassword(auth, email, pass)
        .then((userCredential) => {
          sessionStorage.setItem("isLoggedIn", "true");
          setMasterCardDefault();
          window.location.href = "dashboard.html";
        })
        .catch((error) => {
          alert("Login Failed: " + error.message);
        });
    };

    window.handleSignup = function() {
      const email = document.getElementById('signupEmail').value.trim();
      const pass = document.getElementById('signupPassword').value.trim();

      if (!email || !pass) {
        alert("Please enter both email and password.");
        return;
      }

      createUserWithEmailAndPassword(auth, email, pass)
        .then((userCredential) => {
          sessionStorage.setItem("isLoggedIn", "true");
          setMasterCardDefault();
          window.location.href = "dashboard.html";
        })
        .catch((error) => {
          alert("Signup Failed: " + error.message);
        });
    };
  </script>
</body>
</html>
