<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiwalletP2P - Escrow Room</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 15px;
      padding-bottom: 50px;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e1e;
      padding: 12px 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #333;
    }
    .brand-title {
      font-size: 16px;
      font-weight: bold;
      color: #00d2ff;
    }
    .mode-switch-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }
    .mode-switch-btn.real {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
    }
    .card {
      background: #1e1e1e;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 18px;
      border: 1px solid #2a2a2a;
    }
    .btn-dashboard {
      background: transparent;
      color: #00d2ff;
      border: 1px solid #00d2ff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
    }
    .form-input {
      width: 100%;
      padding: 12px;
      background: #282828;
      border: 1px solid #3d3d3d;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
      margin-top: 8px;
      outline: none;
    }
    .btn-deposit {
      width: 100%;
      padding: 14px;
      background: #00ff88;
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }
    .chat-box {
      background: #181818;
      border: 1px solid #333;
      padding: 12px;
      border-radius: 8px;
      height: 120px;
      overflow-y: auto;
      font-size: 13px;
      color: #ccc;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="background:#00d2ff; color:#000; font-weight:bold; padding:4px 8px; border-radius:6px; font-size:12px;">MW</div>
      <div class="brand-title">Escrow Room</div>
    </div>
    
    <div style="display: flex; align-items: center; gap: 8px;">
      <button id="modeBtn" class="mode-switch-btn" onclick="toggleAccountMode()">Demo Mode</button>
      <a href="dashboard.html" class="btn-dashboard">Dashboard</a>
    </div>
  </div>

  <div class="card" id="modeBannerCard" style="border-left: 4px solid #f59e0b;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <strong id="modeTitle" style="color: #f59e0b; font-size: 14px;"><i class="fa-solid fa-flask"></i> DEMO / TEST MODE ACTIVE</strong>
      <span style="font-size: 12px; color: #aaa;" id="balanceDisplay">Test Bal: $0.00 USD</span>
    </div>
    <p style="font-size: 12px; color: #ccc; margin: 8px 0 0 0;" id="modeDesc">You are currently testing P2P escrow trading safely.</p>
  </div>

  <div class="card">
    <h3 style="margin:0 0 10px 0; font-size:15px; color:#00d2ff;"><i class="fa-solid fa-right-left"></i> Initiate Trade</h3>
    <label style="font-size:13px; color:#ccc;">Trade Amount ($):</label>
    <input type="number" class="form-input" id="tradeAmount" value="50">
    
    <label style="font-size:13px; color:#ccc; display:block; margin-top:12px;">Seller Payment Details:</label>
    <input type="text" class="form-input" value="EcoCash: 0771234567 - John Doe" readonly>

    <button class="btn-deposit" onclick="handleDeposit()"><i class="fa-solid fa-lock"></i> Deposit Funds to Escrow</button>
  </div>

  <div class="card">
    <h3 style="margin:0 0 10px 0; font-size:15px; color:#00d2ff;"><i class="fa-solid fa-comments"></i> Escrow Trade Chat</h3>
    <div class="chat-box" id="chatContainer">
      <div><span style="color:#00d2ff;">[System]:</span> Welcome to MultiwalletP2P Escrow Room.</div>
      <div><span style="color:#f59e0b;">[Agent]:</span> Hello! Please deposit funds to escrow to begin.</div>
    </div>
  </div>

  <script>
    // --- BACKGROUND-SWITCH AUTO-LOCK SECURITY ---
    document.addEventListener("visibilitychange", function() {
      if (document.hidden) {
        sessionStorage.removeItem("isLoggedIn");
      }
    });

    let currentMode = localStorage.getItem('account_mode') || 'demo';

    function updateModeUI() {
      const modeBtn = document.getElementById('modeBtn');
      const modeBannerCard = document.getElementById('modeBannerCard');
      const modeTitle = document.getElementById('modeTitle');
      const modeDesc = document.getElementById('modeDesc');
      const balanceDisplay = document.getElementById('balanceDisplay');

      if (currentMode === 'demo') {
        modeBtn.innerText = "Demo Mode";
        modeBtn.className = "mode-switch-btn";
        modeBannerCard.style.borderLeft = "4px solid #f59e0b";
        modeTitle.innerHTML = '<i class="fa-solid fa-flask"></i> DEMO / TEST MODE ACTIVE';
        modeTitle.style.color = "#f59e0b";
        modeDesc.innerText = "You are currently testing P2P escrow trading safely with simulated funds.";
        balanceDisplay.innerText = "Test Bal: $500.00 USD";
      } else {
        modeBtn.innerText = "Real Account";
        modeBtn.className = "mode-switch-btn real";
        modeBannerCard.style.borderLeft = "4px solid #10b981";
        modeTitle.innerHTML = '<i class="fa-solid fa-circle-check"></i> REAL ACCOUNT ACTIVE';
        modeTitle.style.color = "#10b981";
        modeDesc.innerText = "You are trading with real funds and live market integration.";
        balanceDisplay.innerText = "Real Bal: $0.00 USD";
      }
    }

    function toggleAccountMode() {
      if (currentMode === 'demo') {
        currentMode = 'real';
      } else {
        currentMode = 'demo';
      }
      localStorage.setItem('account_mode', currentMode);
      updateModeUI();
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem("isLoggedIn") !== "true") {
        window.location.href = "index.html";
        return;
      }
      updateModeUI();
    });

    function handleDeposit() {
      let savedPin = localStorage.getItem('user_security_pin');
      if (!savedPin) {
        const newPin = prompt("SECURITY SETUP: Create a new 4-digit Security PIN to protect your escrow transaction:");
        if (newPin && newPin.length === 4 && !isNaN(newPin)) {
          localStorage.setItem('user_security_pin', newPin);
          alert("Security PIN successfully created!");
          savedPin = newPin;
        } else {
          alert("Invalid PIN format. Must be 4 numeric digits.");
          return;
        }
      }

      const enteredPin = prompt("SECURITY VERIFICATION: Enter your 4-digit Security PIN to authorize escrow deposit:");
      if (enteredPin !== savedPin) {
        alert("ACCESS DENIED: Incorrect Security PIN! Transaction aborted for safety.");
        return;
      }

      const amt = document.getElementById('tradeAmount').value;
      const chat = document.getElementById('chatContainer');
      chat.innerHTML += `<div><span style="color:#00ff88;">[You]:</span> Deposited $${amt} USD to Escrow (${currentMode.toUpperCase()} mode).</div>`;
      chat.scrollTop = chat.scrollHeight;
      alert("SUCCESS: Funds deposited to escrow (" + currentMode.toUpperCase() + ").");
    }
  </script>
</body>
</html>
