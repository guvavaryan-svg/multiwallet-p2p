<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiwallet P2P - Dashboard</title>
  
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/888/888870.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e1e;
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .header h2 {
      margin: 0;
      color: #00d2ff;
      font-size: 20px;
    }
    .btn-logout {
      background: #ff4d4d;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
    }
    .wallet-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #2b2b2b;
      padding: 15px;
      border-radius: 8px;
      margin-top: 10px;
    }
    .wallet-info i {
      font-size: 24px;
      color: #00d2ff;
      margin-right: 12px;
    }
    .balance {
      font-size: 18px;
      font-weight: bold;
      color: #00ff88;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2><i class="fa-solid fa-wallet"></i> Multiwallet P2P</h2>
    <button class="btn-logout" id="btnLogout"><i class="fa-solid fa-right-from-bracket"></i> Log Out</button>
  </div>

  <div class="card">
    <h3>Welcome to your Wallet</h3>
    <p id="userEmail">Loading user details...</p>

    <h4>My Balances</h4>
    
    <div class="wallet-box">
      <div class="wallet-info" style="display:flex; align-items:center;">
        <i class="fa-solid fa-dollar-sign"></i>
        <div>
          <strong>USD Balance</strong><br>
          <small>United States Dollar</small>
        </div>
      </div>
      <div class="balance">$0.00</div>
    </div>

    <div class="wallet-box">
      <div class="wallet-info" style="display:flex; align-items:center;">
        <i class="fa-brands fa-bitcoin" style="color: #f7931a;"></i>
        <div>
          <strong>Bitcoin (BTC)</strong><br>
          <small>Crypto Wallet</small>
        </div>
      </div>
      <div class="balance">0.0000 BTC</div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAJQzI4bXDEMYlr2B3Q5Yq3xNZ84iNQEqk",
      authDomain: "multiwalletp2p.firebaseapp.com",
      projectId: "multiwalletp2p",
      storageBucket: "multiwalletp2p.firebasestorage.app",
      messagingSenderId: "63209264976",
      appId: "1:63209264976:web:15b6c1f0f8c03ca69f3e55",
      measurementId: "G-CPMVBW9J9R"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Kutarisa kana munhu akapinda (Logged in)
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('userEmail').innerText = "Logged in as: " + user.email;
      } else {
        // Kana asina kupinda, mudzore pa index.html
        window.location.href = "index.html";
      }
    });

    // Log Out Button
    document.getElementById('btnLogout').addEventListener('click', () => {
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    });
  </script>
</body>
</html>
